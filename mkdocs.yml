site_name: Neural Networks - Eduardo Takei Yaginuma
site_author: Eduardo Takei Yaginuma
site_description: Reports for the Artificial Neural Networks and Deep Learning course at Insper.
site_url: https://eduardotakeiyaginuma.github.io/neural-networks/
repo_url: https://github.com/EduardoTakeiYaginuma/neural-networks
repo_name: EduardoTakeiYaginuma/neural-networks

theme:
  name: material
  language: en
  palette:
    scheme: default
    primary: custom
    accent: custom
  # No Google Fonts request: the stylesheet uses the reader's system faces.
  font: false
  features:
    - content.code.copy
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ['.', 'docs']
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# One section per activity; the folder slug under docs/exercises/ is the contract
# (data, perceptron, mlp, vae). Add the next activity as another block here.
nav:
  - Home: index.md
  - Exercises:
      - '1 - Data':
          - Report: exercises/data/index.md
          - Code: exercises/data/code.md
      - '2 - Perceptron':
          - Report: exercises/perceptron/index.md
          - Code: exercises/perceptron/code.md
